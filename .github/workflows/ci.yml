name: ci

# Runs on every push and pull request: validates the storyboard, runs the unit tests, and builds the
# whole film in dry-run mode (placeholder narration and frames, no API keys) to prove the pipeline
# still runs end to end from a clean clone.
on:
  push:
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Check no secrets are committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$|kaggle\.json$'; then echo "secret file committed"; exit 1; fi
      - name: Validate storyboard
        run: python pipeline/validate.py
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Dry-run film in a scratch copy
        run: |
          rsync -a --exclude .git ./ /tmp/scratch/ && cd /tmp/scratch
          rm -rf outputs && make film-dry
          ls -la outputs/final
